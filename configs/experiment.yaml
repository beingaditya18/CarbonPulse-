# Master Experiment Configuration
# Project: Explainable AI for Carbon Emissions Estimation: A Comparative Evaluation

experiment:
  name: "carbon_emissions_xai_benchmark"
  description: "Comparative benchmark of predictive accuracy, interpretability, and computational efficiency"
  random_seed: 42
  target_variable: "TotalGHGEmissions"
  target_units: "Metric Tons CO2e / yr"

data:
  raw_path: "data/raw/seattle_building_energy_benchmarking_raw.csv"
  processed_dir: "data/processed"
  test_size: 0.2
  group_column: "OSEBuildingID"
  cv_folds: 5

models:
  baseline_accounting:
    enabled: true
    description: "Conventional Scope 1+2 activity-data-times-emission-factors baseline"
    factors:
      electricity_kwh: 0.00001972   # MT CO2e / kWh (0.0197 kg CO2e / kWh - Seattle City Light hydro grid)
      naturalgas_therms: 0.005299   # MT CO2e / therm (5.30 kg CO2e / therm - EPA fuel factor)
      steamuse_kbtu: 0.00008100     # MT CO2e / kBtu (0.081 kg CO2e / kBtu - District steam factor)

  baseline_heuristic:
    enabled: true
    description: "Property-Type Median Intensity Baseline for unmetered prediction"
    group_feature: "BuildingType"
    intensity_metric: "median"

  ridge:
    enabled: true
    alpha: 10.0
    random_state: 42

  gam:
    enabled: true
    description: "Spline Generalized Additive Model via SplineTransformer and Ridge regression"
    n_knots: 5
    degree: 3
    alpha: 10.0
    random_state: 42

  ebm:
    enabled: true
    description: "Explainable Boosting Machine (InterpretML)"
    max_bins: 256
    max_interaction_bins: 32
    interactions: 10
    outer_bags: 8
    inner_bags: 0
    learning_rate: 0.05
    random_state: 42

  random_forest:
    enabled: true
    n_estimators: 150
    max_depth: 16
    min_samples_split: 5
    min_samples_leaf: 2
    n_jobs: -1
    random_state: 42

  xgboost:
    enabled: true
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    n_jobs: -1
    random_state: 42

  mlp:
    enabled: true
    hidden_layer_sizes: [128, 64]
    activation: "relu"
    alpha: 0.001
    learning_rate_init: 0.001
    max_iter: 200
    early_stopping: true
    validation_fraction: 0.1
    random_state: 42

benchmarking:
  warmup_runs: 5
  latency_repetitions: 100
  batch_sizes: [1, 32, 128, 512]
  grid_emissions_factor_kg_per_kwh: 0.370 # Regional electricity grid intensity for computational footprint (kg CO2e / kWh)

explainability:
  background_samples: 100
  stability_runs: 5
  stability_subsample_ratio: 0.8
  perturbation_scale: 0.05
